function icon(n,c){return '<svg class="i '+(c||"")+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[n]||"")+"</svg>"}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return null}}

var AREAS=[["VISC","Visual Comm"],["IXD","Interaction"],["Illus","Illustration"],["Anim","Animation"],["ID","Industrial"],["Pkg","Packaging"],["Ad","Advertising"],["Type","Type"],["Motion","Motion"],["Photo","Photo"]];
var ALL=AREAS.map(function(a){return a[0]});
var NAME={};AREAS.forEach(function(a){NAME[a[0]]=a[1]});
var CLS={VISC:"b-gd",IXD:"b-ux",Illus:"b-rose",Anim:"b-violet",ID:"b-green"};
var MIN_SEEN=new Date().getFullYear()-1;
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function pd(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function tiers(l){return (Array.isArray(l.tiers)?l.tiers:[]).filter(function(t){return t&&pd(t.date)}).slice().sort(function(a,b){return a.date.localeCompare(b.date)})}
function nextTier(l){var ts=tiers(l),t0=today();for(var i=0;i<ts.length;i++)if(pd(ts[i].date)>=t0)return {t:ts[i],n:ts.length,after:ts[i+1]||null};return null}
function nd(l){var x=nextTier(l);return x?x.t.date:l.deadline}
function sd(l){return l.kind==="event"?nd(l):(l.deadline||nd(l))}
function tierChip(l){var x=nextTier(l);if(!x||x.n<2||!x.after)return "";return '<span class="badge b-plain">'+icon("clock","i-xs")+"Then "+(x.after.label?esc(x.after.label)+" ":"")+esc(fmt(x.after.date,true))+"</span>"}
function tierHTML(l){var ts=tiers(l);if(ts.length<2)return esc(fmt(l.deadline));var t0=today();return '<span style="display:grid;gap:.125rem">'+ts.map(function(t){var past=pd(t.date)<t0;return '<span'+(past?' style="color:var(--muted-fg);text-decoration:line-through"':"")+">"+esc(t.label)+": "+esc(fmt(t.date))+(t.fee?" ("+esc(t.fee)+")":"")+"</span>"}).join("")+"</span>"}
function tiersText(l){return tiers(l).map(function(t){return [t.label,t.date,t.fee||""].join(" | ").replace(/ \| $/,"")}).join("\n")}
function left(l){var d=pd(nd(l));return d?Math.round((d-today())/864e5):null}
function closed(l){var n=left(l);return n!==null&&n<0}
var AP_MON=["Jan.","Feb.","March","April","May","June","July","Aug.","Sept.","Oct.","Nov.","Dec."];
function fmt(s){var d=pd(s);if(!d)return "Dates TBA";return AP_MON[d.getMonth()]+" "+d.getDate()+(d.getFullYear()!==new Date().getFullYear()?", "+d.getFullYear():"")}
function stale(l){return (l.last_seen||0)<MIN_SEEN}
function isLive(l){return !l.status&&!l.archived_at&&!stale(l)}
function isSugg(l){return l.status==="suggested"||(isLive(l)&&l.proposed)}
function onWatch(l){return l.status==="watch"||(!l.status&&(l.archived_at||stale(l)))}
function upcoming(l){var n=left(l);return l.kind!=="event"&&!l.deadline_est&&n!==null&&n>=0&&n<=30}
function find(id){for(var i=0;i<DATA.listings.length;i++)if(DATA.listings[i].id===id)return DATA.listings[i];return null}

var state={tab:"comp",areas:ALL.slice(),scope:"all",cost:"all",sort:"deadline",view:"card",q:"",showClosed:false,upcoming:false,dd:false,modal:null,admin:false,preview:false,form:null};
try{var sv=JSON.parse(ss("kuc")||"{}");["cost","view","sort","scope"].forEach(function(k){if(sv[k])state[k]=sv[k]});if(Array.isArray(sv.areas))state.areas=sv.areas.filter(function(a){return ALL.indexOf(a)>-1});if(["all","regional","local"].indexOf(state.scope)<0)state.scope="all"}catch(e){}
function save(){ss("kuc",JSON.stringify({areas:state.areas,scope:state.scope,cost:state.cost,view:state.view,sort:state.sort}))}
function editing(){return state.admin&&!state.preview}

var CAP={artifact:null};
function buildPage(data){
  var json=JSON.stringify(data).replace(/</g,"\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
   "<title>KU Design Competitions and Events</title>\n"+'<meta name="claude:viewport-fit-sides" content="cover">\n'+
   '<style id="styles">'+document.getElementById("styles").textContent+"</style>\n"+'<div id="root"></div>\n'+
   '<script type="application/json" id="board-data">'+json+"<\/script>\n"+'<script id="app">'+document.getElementById("app").textContent+"<\/script>\n</body></html>"}
var PUB_MSG={conflict:"Someone else saved the board first, so it's reloading with their version. Make your change again.",rate_limited:"Saving too quickly. Wait a moment, then try again.",too_large:"The board is too large to save. Archive some old entries and try again."};
function commit(next,flash){
  if(!CAP.artifact){toast("Can't save","Saving isn't available here. Open the board from claude.ai while signed in.");return Promise.resolve(false)}
  ss("kuc-flash",flash);ss("kuc-tab",state.tab);ss("kuc-y",String(window.scrollY||0));busy(true);
  return CAP.artifact.publish(buildPage(next)).then(function(){return true},function(e){
    busy(false);ss("kuc-flash",null);ss("kuc-tab",null);ss("kuc-y",null);var code=e&&e.code;
    if(code==="conflict"){toast("Board changed",PUB_MSG.conflict);return false}
    if(["not_writer","not_granted","not_declared","consent_required","capability_disabled","capability_removed"].indexOf(code)>-1)toast("Can't save","Only the board's owner and editors can save changes.");
    else toast("Couldn't save",PUB_MSG[code]||"Something went wrong while saving. Try again.");
    return false})}
function replaceListing(rec){return {settings:DATA.settings,listings:DATA.listings.map(function(x){return x.id===rec.id?rec:x})}}
function now(){return new Date().toISOString()}

var root=document.getElementById("root");
function toast(t,b){var el=document.getElementById("toasts");if(!el)return;var d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.innerHTML="<b>"+esc(t)+"</b>"+(b?esc(b):"");el.appendChild(d);setTimeout(function(){d.remove()},6000)}
function busy(on){var el=document.getElementById("busy");if(el)el.hidden=!on}

var SHORT={VISC:"VISC",IXD:"IXD",Illus:"ILLU",Anim:"ANIM",ID:"INDD",Pkg:"PKG",Ad:"ADV",Type:"TYPE",Motion:"MOTION",Photo:"PHOTO"};
function tagShort(t){return '<span class="badge tag-s '+(CLS[t]||"b-plain")+'" title="'+esc(NAME[t]||t)+'">'+esc(SHORT[t]||t)+"</span>"}
function locText(l){return l.where||(l.kind==="event"?"Location TBA":"Online")}
function tagBadge(t){return '<span class="badge '+(CLS[t]||"b-plain")+'">'+esc(NAME[t]||t)+"</span>"}
function whereBadge(l){return l.where?'<span class="badge b-plain">'+icon("pin","i-xs")+esc(l.where)+"</span>":""}
function feeAmt(s){s=String(s||"");var m=/([$€£])\s?(\d+(?:,\d{3})*(?:\.\d+)?)(?:\s?[–-]\s?[$€£]?(\d+(?:,\d{3})*(?:\.\d+)?))?/.exec(s);if(!m)return null;var n=parseFloat(m[2].replace(/,/g,"")),r=m[1]==="€"?1.1:m[1]==="£"?1.3:1,cad=/\bCAD\b/.test(s);if(cad)r*=.73;return {usd:n*r,txt:m[1]+m[2]+(m[3]?"–"+m[3]:"")+(cad?" CAD":"")}}
function feeLevel(u){return u===0?0:u<=25?1:u<=50?2:u<100?3:4}
function feeBadge(l){var lv,txt;
  if(l.free){lv=0;txt="FREE"}else{
    var x=nextTier(l),a=null;
    if(x&&x.t.fee){var c=feeAmt(x.t.fee),nx=x.after&&x.after.fee?feeAmt(x.after.fee):null;if(c){a=c;txt=c.txt}}
    if(!a){a=feeAmt(l.fee);if(a)txt=a.txt}
    if(!a)return '<span class="badge fee fee-u" title="'+esc(l.fee||"Fee not posted")+'">'+icon("dollar","i-xs")+"See site</span>";
    lv=feeLevel(a.usd)}
  var n=Math.max(1,lv),ic="";for(var i=0;i<n;i++)ic+=icon("dollar","i-xs");
  return '<span class="badge fee fee-'+lv+'" title="'+esc(l.free?"Free to enter":l.fee)+'"><span class="fee-ic" aria-label="'+"$$$$".slice(0,n)+'">'+ic+"</span>"+esc(txt)+"</span>"}
function dateBit(l){
  var x=nextTier(l),ev=l.kind==="event",sub=ev&&x&&x.after,D=sd(l);
  if(!D)return '<span class="deadline">'+icon("calendar","i-xs")+"Dates TBA</span>";
  var n=Math.round((pd(D)-today())/864e5);
  if(n<0)return '<span class="deadline">'+icon("clock","i-xs")+"Closed "+esc(fmt(D))+"</span>";
  var soon=!l.deadline_est&&n<=14,w=ev&&!sub?"Starts":"Due";
  return '<span class="deadline'+(soon?" soon":"")+'">'+icon("calendar","i-xs")+w+" "+(n===0?"today":esc(fmt(D)))+"</span>"}
function linkBtn(l){return l.url?'<a class="btn btn-secondary btn-block" href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer" data-stop>'+icon("ext")+"View "+(l.kind==="event"?"Event":"Competition")+"</a>":'<p class="nolink">No current entry page online</p>'}
function adminRow(l){
  if(!editing())return "";
  if(state.tab==="watch")return '<div class="card-admin"><button class="btn btn-ghost btn-sm" data-action="edit" data-id="'+l.id+'">'+icon("pencil","i-sm")+'Edit</button>'+(l.archived_at||l.status==="watch"?'<button class="btn btn-ghost btn-sm" data-action="restore" data-id="'+l.id+'">'+icon("check","i-sm")+"Restore</button>":"")+"</div>";
  return '<div class="card-admin"><button class="btn btn-ghost btn-sm" data-action="edit" data-id="'+l.id+'">'+icon("pencil","i-sm")+'Edit</button><button class="btn btn-ghost btn-sm btn-danger" data-action="archive" data-id="'+l.id+'">'+icon("archive","i-sm")+"Archive</button></div>"}
var FIELD_LABEL={tiers:"Deadlines",archived_at:"Status",deadline:"Deadline",deadline_est:"Estimated?",fee:"Fee",free:"Free",url:"Link",last_seen:"Confirmed",summary:"Summary",eligibility:"Who can enter",name:"Name",org:"Organizer",where:"Location",scope:"Reach"};
function showVal(k,v){if(k==="deadline")return v?fmt(v):"TBA";if(k==="tiers")return Array.isArray(v)&&v.length?v.map(function(t){return t.label+" "+fmt(t.date,true)+(t.fee?" ("+t.fee+")":"")}).join(" · "):"—";if(k==="archived_at")return v?"Hidden (merged into another post)":"Live";if(typeof v==="boolean")return v?"Yes":"No";return v==null||v===""?"—":String(v)}
function suggBlock(l){
  var h="";
  if(l.status!=="suggested"&&l.proposed){
    h+='<div class="diff">'+Object.keys(l.proposed).map(function(k){return '<div class="diff-row"><span class="k">'+esc(FIELD_LABEL[k]||k)+'</span><span><del>'+esc(showVal(k,l[k]))+"</del> → <ins>"+esc(showVal(k,l.proposed[k]))+"</ins></span></div>"}).join("")+"</div>"}
  if(l.scout_notes&&l.scout_notes.length)h+='<ul class="sugg-notes">'+l.scout_notes.map(function(n){return "<li>"+icon("info","i-xs")+"<span>"+esc(n)+"</span></li>"}).join("")+"</ul>";
  if(l.found_via)h+='<p class="sugg-src">Source: <a href="'+esc(l.found_via)+'" target="_blank" rel="noopener noreferrer" data-stop>'+esc(l.found_via)+"</a></p>";
  h+='<div class="card-admin"><button class="btn btn-ghost btn-sm" data-action="edit" data-id="'+l.id+'">'+icon("pencil","i-sm")+'Edit</button><button class="btn btn-ghost btn-sm btn-danger" data-action="dismiss" data-id="'+l.id+'">'+icon("x","i-sm")+'Dismiss</button><button class="btn btn-primary btn-sm" data-action="approve" data-id="'+l.id+'">'+icon("check","i-sm")+"Approve</button></div>";
  return h}
function cardHTML(l){
  var sugg=state.tab==="sugg",watch=state.tab==="watch";
  var badge=sugg?(l.status==="suggested"?'<span class="badge b-sugg">'+icon("sparkles","i-xs")+"New</span>":'<span class="badge b-upd">'+icon("pencil","i-xs")+"Update</span>"):"";
  var whyHidden=watch?'<p class="watch-why">'+(l.archived_at?"Archived by an editor.":l.status==="watch"?"Held by the scout: no recent edition found.":"Hidden: last confirmed running in "+(l.last_seen||"an unknown year")+".")+"</p>":"";
  return '<article class="card'+(closed(l)&&!sugg?" closed":"")+'" tabindex="0" role="button" data-action="open" data-id="'+l.id+'" aria-label="'+esc(l.name)+'">'+
   '<div class="card-top"><div class="card-tags">'+badge+l.tags.map(tagShort).join("")+"</div>"+dateBit(l)+"</div>"+
   '<div class="card-body"><h3>'+esc(l.name)+"</h3>"+
    '<div class="meta" title="Location">'+icon("pin")+"<span>"+esc(locText(l))+"</span></div>"+
    '<div class="meta" title="Organizer">'+icon("gavel")+"<span>"+esc(l.org)+"</span></div>"+
    '<div class="meta" title="Who can enter">'+icon("cap")+"<span>"+esc(l.eligibility)+"</span></div>"+
    '<div class="chips">'+feeBadge(l)+(l.deadline_est&&l.deadline?'<span class="badge b-est">Date estimated</span>':"")+"</div>"+
    '<p class="blurb">'+esc(l.summary)+"</p>"+whyHidden+(sugg?suggBlock(l):"")+"</div>"+
   (sugg?"":'<div class="card-foot">'+linkBtn(l)+"</div>"+adminRow(l))+"</article>"}
function rowHTML(l){
  var d=pd(sd(l));
  return '<article class="row'+(closed(l)?" closed":"")+'" tabindex="0" role="button" data-action="open" data-id="'+l.id+'" aria-label="'+esc(l.name)+'">'+
   '<div class="row-date">'+(d?"<small>"+d.toLocaleDateString("en-US",{month:"short"})+"</small><b>"+(l.deadline_est?"~":"")+d.getDate()+"</b>":"<small>TBA</small>")+"</div>"+
   '<div class="row-main"><div class="row-title"><h3>'+esc(l.name)+"</h3>"+feeBadge(l)+"</div>"+
   '<p class="row-sub">'+esc([l.org].concat(l.tags.map(function(t){return NAME[t]||t})).join(" · "))+"</p></div>"+
   (editing()?'<button class="btn btn-ghost btn-sm" data-action="edit" data-id="'+l.id+'" aria-label="Edit">'+icon("pencil","i-sm")+"</button>":"")+
   (l.url?'<a class="row-link" href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer" data-stop aria-label="Open official page">'+icon("ext","i-md")+"</a>":"")+"</article>"}
function seg(action,v,label,cur,ic,title){return '<button class="btn btn-ghost" data-action="'+action+'" data-v="'+esc(v)+'" aria-pressed="'+(cur===v)+'"'+(title?' title="'+esc(title)+'"':"")+">"+(ic?icon(ic):"")+esc(label)+"</button>"}

function base(){
  var t=state.tab;
  if(t==="sugg")return DATA.listings.filter(isSugg);
  if(t==="watch")return DATA.listings.filter(onWatch);
  return DATA.listings.filter(function(l){return isLive(l)&&((t==="events")===(l.kind==="event"))})}
function filtered(){
  var q=state.q.trim().toLowerCase(),t=state.tab,mgmt=t==="sugg"||t==="watch";
  var r=base().filter(function(l){
    if(mgmt)return !q||[l.name,l.org].join(" ").toLowerCase().indexOf(q)>-1;
    if(!state.showClosed&&closed(l))return false;
    if(state.upcoming&&t==="comp"&&!upcoming(l))return false;
    if(state.areas.length<ALL.length&&!l.tags.some(function(x){return state.areas.indexOf(x)>-1}))return false;
    if(state.cost==="free"&&!l.free)return false;
    if(state.scope==="local"&&l.scope!=="local")return false;
    if(state.scope==="regional"&&l.scope!=="local"&&l.scope!=="regional")return false;

function readForm(rec){

    tags:Array.prototype.slice.call(document.querySelectorAll("[data-tag]")).filter(function(c){return c.checked}).map(function(c){return c.dataset.tag})});
  var TB=false,TL=[];v("tiers").split("\n").map(function(s){return s.trim()}).filter(Boolean).forEach(function(line){var q=line.split("|").map(function(s){return s.trim()});if(!pd(q[1]))TB=true;else TL.push({label:q[0]||"Deadline",date:q[1],fee:q[2]||""})});
  TL.sort(function(a,b){return a.date.localeCompare(b.date)});r.tiers=TL;if(TL.length)r.deadline=TL[TL.length-1].date;

function slug(s){return s.toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48)||"entry"}
function saveForm(){
  var m=state.modal,out=readForm(m.rec);
  if(Object.keys(out.errs).length){state.modal={type:"form",rec:out.rec,errs:out.errs};modal();return}
  var r=out.rec;r.updated_at=now();
  var next;
  if(r.id){next=replaceListing(r)}else{var id=slug(r.name);while(find(id))id+="-2";r.id=id;next={settings:DATA.settings,listings:DATA.listings.concat([r])}}
  commit(next,"Saved "+r.name+".")}
function approve(id){
  var l=find(id);if(!l)return;var rec;

  else{rec=Object.assign({},l,l.proposed||{},{proposed:null,scout_notes:[],found_via:"",updated_at:now()})}
  commit(replaceListing(rec),(l.status==="suggested"?"Published ":"Updated ")+l.name+". Students can see it now.")}
function dismiss(id){

  commit(replaceListing(rec),"Dismissed the suggestion for "+l.name+".")}

root.addEventListener("click",function(e){

  if(e.target.closest(".dd-menu"))return;
  var t=e.target.closest("[data-action]");if(!t)return;
  var a=t.dataset.action,v=t.dataset.v,id=t.dataset.id;
  if(a==="close"){if(e.target.closest("[data-keep]")&&t.classList.contains("overlay"))return;state.modal=null;modal();return}
  if(a==="open"){state.modal={type:"detail",id:id};modal();return}
  if(a==="edit"){var l=find(id);if(l){state.modal={type:"form",rec:JSON.parse(JSON.stringify(l))};modal()}return}
  if(a==="add"){state.modal={type:"form",rec:blank()};modal();return}

  if(a==="dd"){state.dd=!state.dd;render();return}
  if(a==="home"){e.preventDefault();state.tab="comp";state.areas=ALL.slice();state.dd=false;state.scope="all";state.upcoming=false;state.cost="all";state.q="";render();return}
  if(a==="tab")state.tab=v;else if(a==="cost")state.cost=v;else if(a==="scope")state.scope=v;else if(a==="sort")state.sort=v;else if(a==="view")state.view=v;else if(a==="closed")state.showClosed=!state.showClosed;else if(a==="upcoming")state.upcoming=!state.upcoming;
  save();render()});
